# Global mise tools for Linux, linked to ~/.config/mise/config.toml.
# The first block is what Omarchy ships; the rest replaces fnm/pyenv/Homebrew
# runtimes from the macOS setup.
[tools]
claude = "latest"
codex = "latest"
gh = "latest"
node = "24"
pi = "latest"

bun = "latest"
go = "latest"
python = "latest"
uv = "latest"

[settings.node]
corepack = true
npm_shim = false
