name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          # Need full history + tags so `changeset git-tag` skips versions already tagged
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Tag
        id: changesets
        # v2 learns which tags were created from the NDJSON events the Changesets
        # v3 CLI writes to $CHANGESETS_OUTPUT; v1 grepped stdout for "New tag:",
        # which the v3 CLI no longer prints, so it never pushed tags or releases
        uses: changesets/action@v2.1.2
        with:
          version-script: pnpm run version
          # `changeset git-tag` creates a vX.Y.Z tag locally; the action pushes it
          # and cuts a GitHub Release from the matching CHANGELOG.md section
          publish-script: pnpm run release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
